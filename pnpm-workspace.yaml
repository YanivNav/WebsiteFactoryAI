packages:
  - "apps/*"
  - "packages/*"

# Native/binary build scripts we explicitly trust.
#   sharp         → Next.js image optimization
#   esbuild       → Convex + tsx
#   unrs-resolver → ESLint resolver
allowBuilds:
  esbuild: true
  node-pty: set this to true or false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.23'
  - '@ai-sdk/provider-utils@5.0.11'
  - ai@7.0.31
